[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "lorafit"
version = "0.2.0"
description = "Find mismatches between a PEFT LoRA adapter and its local SafeTensors base."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["lora", "peft", "safetensors", "checkpoint", "preflight"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
lorafit = "lorafit.cli:main"
lora-fitcheck = "lorafit.cli:main"

[project.optional-dependencies]
dev = ["build>=1.2,<2", "mypy>=1.15,<3", "packaging>=24,<27", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/lorafit", "src/lora_fitcheck"]

[tool.hatch.build.targets.sdist]
include = [
  "/src", "/tests", "/examples", "/benchmarks", "/scripts", "/docs", "/assets",
  "/README.md", "/LICENSE", "/CONTRIBUTING.md", "/CODE_OF_CONDUCT.md",
  "/CITATION.cff", "/CHANGELOG.md",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples", "benchmarks", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers"
