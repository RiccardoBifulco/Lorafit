<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 320" width="1080" height="320" role="img" aria-labelledby="title description">
  <title id="title">LoRAFit</title>
  <desc id="description">Check LoRA compatibility before loading weights. The demo reports a match for the original base and mismatched projection dimensions for a different base.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop stop-color="#151f30"/>
      <stop offset="1" stop-color="#0b111c"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#61748e" stroke-opacity=".11"/>
    </pattern>
    <clipPath id="frame"><rect width="1080" height="320" rx="24"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1080" height="320" fill="url(#background)"/>
    <rect width="1080" height="320" fill="url(#grid)"/>
    <path d="M405 0 725 320M435 0 755 320M465 0 785 320" fill="none" stroke="#83e6b5" stroke-opacity=".07" stroke-width="1.5"/>
  </g>
  <rect x=".5" y=".5" width="1079" height="319" rx="23.5" fill="none" stroke="#354259"/>
  <g transform="translate(52 46)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect width="50" height="50" rx="13" fill="#193430" stroke="#3b7360"/>
    <path d="M18 14h-5v22h5m14-22h5v22h-5" stroke="#a8ebc7" stroke-width="2.5"/>
    <path d="m19 25 4 4 8-9" stroke="#83e6b5" stroke-width="2.7"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="49" y="169" font-size="78" font-weight="750" letter-spacing="-3" fill="#f3f7ff">LoRA<tspan fill="#83e6b5">Fit</tspan></text>
    <text x="53" y="224" font-size="26" fill="#c8d4e4">Check LoRA compatibility</text>
    <text x="53" y="257" font-size="26" fill="#c8d4e4">before loading weights.</text>
  </g>
  <rect x="502" y="36" width="533" height="249" rx="14" fill="#0a111c" stroke="#354259"/>
  <path d="M502 78h533" stroke="#354259"/>
  <g fill="#75879f">
    <circle cx="521" cy="57" r="3.5"/><circle cx="534" cy="57" r="3.5"/><circle cx="547" cy="57" r="3.5"/>
  </g>
  <g font-family="Cascadia Mono, Consolas, DejaVu Sans Mono, monospace">
    <text x="567" y="62" font-size="14" fill="#9fadc1">lorafit demo</text>
    <text x="524" y="114" font-size="20" fill="#e4ecf8"><tspan fill="#8b9db6">$</tspan> lorafit check base adapter</text>
    <text x="524" y="145" font-size="20" fill="#83e6b5" font-weight="700">MATCH: 2/2 modules match</text>
    <path d="M524 169h489" stroke="#263347"/>
    <text x="524" y="204" font-size="20" fill="#e4ecf8"><tspan fill="#8b9db6">$</tspan> lorafit check wrong-base adapter</text>
    <text x="524" y="235" font-size="20" fill="#ff9d91" font-weight="700">MISMATCH: 1/2 modules match</text>
    <text x="524" y="263" font-size="17" fill="#b8c6d9">v_proj   adapter (8, 16) · base (4, 16)</text>
  </g>
</svg>
