name: Bug report
description: Report incorrect output or an unexpected error
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version and platform
      description: Show the output of lorafit --version and give the Python version and OS.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: A command and small synthetic fixture are best. Remove private paths and weights.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected result, actual report, and exit code
    validations:
      required: true
